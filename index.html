<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <!-- Header Section -->
        <header id="main-header">
            <h1>My Budget Tracker</h1>
            <p class="subtitle">Track your income and expenses in one simple place.</p>
        </header>

        <!-- Add Expense Form Section -->
        <section id="add-expense-section" class="card">
            <h2>Add New Expense</h2>

            <div class="form-group">
                <label for="expense-name">Expense Name</label>
                <input type="text" id="expense-name" placeholder="e.g., Groceries">

            <div class="form-group">
                <label for="expense-amount">Amount ($)</label>
                <input type="number" id="expense-amount" placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="expense-category">Category</label>
                <select id="expense-category">
                    <option value="">Select a category</option>
                    <option value="food">Food & Dining</option>
                    <option value="rent">Rent & Utilities</option>
                    <option value="transport">Transportation</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="button" class="btn-primary">Add Expense</button>
        </section>

        <!-- Expenses Display / Placeholder Section -->
        <section id="expenses-list-section" class="card">
            <h2>Your Expenses</h2>
            <p class="placeholder-text">No expenses added yet. Fill out the form above to get started!</p>
        </section>
    </main>
    <script src="script.js" <>/script>
</body >

</html >
